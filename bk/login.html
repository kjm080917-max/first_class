<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        <title>버거킹 로그인 화면</title>
        <style>
            :root {
                --font: "Sandoll GothicNeoRound", sans-serif;
                --font-Pre: "Pretendard Variable", sans-serif;
                --font-BKR: "BKR", sans-serif;
                --primary: #512314;
                --disabledBg: #DDCDBE;
                --focus: #D62302;
                --baseBorder: #D9CFC6;
                --baseBg: #FFFCF9;
                --button: #E9DDCD;
                --errorColor: #C54734;
                --placeholder: #EBE6E2;
                --text: #766053;
                --bg: #f4ebdc;
            }
            html {
                font-size: 62.5%;
            }
            /* 전체 텍스트 속성 */
            body {
                font-family: var(--font);
                font-size: 1.6rem;
                color: var(--primary)
            }
            a {
                color:inherit;
            }
            #wrap {
                width: 100%;
                background-color: var(--bg);
                max-width: 1024px;
                min-width: 360px;
                margin: 0 auto;
                background-color: var(--bg);
                min-height:100dvh;
            }
            header {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 48px;
            }
            .prev_btn {
                position: absolute;
                left: 0;
                width: 48px;
                height: 48px;
                background: url(img/back_icon.svg) no-repeat center / auto;
            }
            h1 {
                font-size: 2.0rem;
                order:2;
            }
            main {

                padding: 48px 20px 90px;
            }
            .title {
                display: flex;
                flex-direction: column;
                font-family: var(--font-BKR);
                gap: 16px;
                /* margin-top: 48px; */
                margin-bottom: 50px;
                font-family: var(--font-BKR);
            }
            .title span:first-child {
                font-size: 2.5rem;
            }
            .title > span:last-child {
                font-size: 3.5rem;
            }
            input {
                border: 1px solid var(--baseBorder);
                background-color: var(--baseBg);    
            }
            input {
                font-family: inherit;
                font-size: inherit;
                color: inherit;
            }
            input::placeholder {
                color: var(--placeholder)
            }
            .email {
                font-size: 1.5rem;
                line-height: 1;
            }
                input[type="email"] {
                margin-top: 8px;
            }
              input[type="password"] {
                margin-top: 0;
            }
            input[type="email"]
            input[type="password"] {
                width: 350px;
                height: 50px;
                padding: 0 - 20px;
                border-radius: 10px;
            }
            
            /*button 요소는 기본적으로 상속이 불가하며 상속에 관현된 값을 따로 넣어야함 */
            .login_btn {
                font-family: inherit;
                font-size: inherit;
                color: var(--placeholder);
                background-color: var(--primary);
                border: none;
                opacity: 0.2;
            }
            a {
                text-decoration: none;
            }
            .login_btn {
                width: 100%;
                height: 50px;
                border-radius: 22px;
                font-family: inherit;
                font-size: inherit;
                color: var(--placeholder);
                background-color: var(--primary);
                border: none;
                opacity: 0.2;
            }
            .login_link {
                margin-top: 20px;
                font-family: var(--font-Pre);
                font-weight: 500;
                font-size: 1.4rem;
                text-align: center;
            }
            .login_link a {
              display: inline-flex;
              align-items: center;
              column-gap: 4px;
            }
            
            .login_link a::after {
                content: "";
                display: inline-block;
                width: 1px;
                height: 12px;
                background-color: var(--text);
                opacity: 1;
            }
            .login_link a:last-child::after {
                content: "";
                display: none;
            }
            .sns_login {
                margin-top: 96px;
            }
            .sns_login > p {
                display: flex;
                align-items: center;
                column-gap: 12px;
                font-size: 1.3rem;
                margin-bottom: 35px;
                color:var(--text);
                white-space: nowrap;
            }
            .sns_login > p::before ,
            .sns_login > p::after {
                content: "";
                display: inline-block;
                width: 100%;
                height: 5px;
                background-color: var(--primary);
                opacity: 0.3;
              }
            input[type="email"], 
            input[type="password"] {
                width: 100%;
                height: 50px;
                padding-left: 20px;
                padding-right: 20px;
                border-radius: 10px;
            }
            .pw_btn {
                position: absolute;
                top: 50%;
                right: 16px;
                transform: translateY(-50%);
                width: 26px;
                height: 26px;
                background: url(img/eye_icon.svg) no-repeat center / auto; 
            }
            .password_box {
                position: relative;
                margin-top: 10px;
            }
            .password_box input {
                display: block;
                padding-right: 56px;
            }
            .login_option {
                margin-top: 12px;
            }

            .login_option label {
                display: inline-flex;
            }
            .login_option label:first-child {
                margin-right: 30px;
            }


            .login_option span {
                display: inline-flex;
                align-items: center;
                column-gap: 6px;
            }
            .login_option .check + span::before {
                content: "";
                display: inline-block;
                width: 30px;
                height: 30px;
                background: url(img/checkbox_disabled.svg) no-repeat center / contain;
            
            }
            .login_option .check:checked + span::before {
                content: "";
                display: inline-block;
                width: 30px;
                height: 30px;
                background-image: url(img/checkbox_active.svg);no-repeat center / contain;
                
            }
            .sns_list {
                display: flex;
                align-items: center;
                justify-content: center;
                column-gap: 20px;
            }

            .sns_list > a {
                display: inline-block;
                width: 45px;
                height: 45px;
                background-repeat: no-repeat;
                background-position: center;
                background-size: 45px;
            }
            .sns_list > a:nth-child(1) {
                background-image: url(img/kakao_logo_icon.svg);
            }
            .sns_list > a:nth-child(2) {
                background-image: url(img/naver_logo_icon.svg);
            }
            .sns_list > a:nth-child(3) {
                background-image: url(img/apple_logo_icon.svg);
            }
            .sns_list > a:nth-child(4) {
                background-image: url(img/samsung_logo_icon.svg);
            }
        </style>
    </head>
        <body>
            <div id="wrap">
                <!-- 로그인 폼 내용 -->
                <header> 
                    <h1>로그인</h1>
                    <button class="prev_btn"><span class="sr-only">이전버튼</span></button> 
                </header>
                <main>
                    <h2 class="title">
                    <span>안녕하세요:)</span>
                    <span>버거킹입니다</span>
                    </h2>
                    <form action="">
                        <!--이메일 로그인-->
                        <fieldset>
                            <legend class="sr-only">로그인화면</legend>
                            <!--아이디-->
                            <label for="email" class>이메일 로그인</label>
                            <div class="input_box">
                                <input type="email" name="email"
                                placeholder="아이디(이메일)을 입력해 주세요.">
                            </div>
                            <!--비밀번호-->
                            <div class="input_box password_box">
                                <input type="password" name="password"
                                placeholder="비밀번호를 입력해 주세요">
                                <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span></button>
                            </div>
                            <div class="login_option">
                                <label>
                                    <input type="checkbox" class="check sr-only"checked>
                                    <span>자동로그인</span>
                                </label>
                                <label>
                                    <input type="checkbox" class="check sr-only">
                                    <span>아이디 저장</span>
                                </label>
                            </div>
                            <button type="submit" class="login_btn">로그인</button>
                        </fieldset>
                    </form>
                    <div class="login_link">
                        <a href="#">아이디 찾기</a>
                        <a href="password_reset.html">비밀번호 재설정</a>
                        <a href="#">회원가입</a>
                    </div>
                    <div class="sns_login">
                        <p>SNS으로 간편하게 로그인</p>
                        <div class="sns_list">
                            <a href="#"><span class="sr-only">카카오로그인</span></a>
                            <a href="#"><span class="sr-only">네이버로그인</span></a>
                            <a href="#"><span class="sr-only">애플로그인</span></a>
                            <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                        </div>
                    </div>
                </main>
            </div>
        </body>
</html>
