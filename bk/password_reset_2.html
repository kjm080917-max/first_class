<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
    <link rel="stylesheet" href="../font/css/sdgothicneo.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">

    <title>버거킹 비밀번호 재설정 완료</title>

    <style>
        :root {
            --font: "Sandoll GothicNeoRound", sans-serif;
            --font-Pre: "Pretendard Variable", sans-serif;
            --font-BKR: "BKR", sans-serif;
            --primary: #512314;
            --text: #766053;
            --bg: #f4ebdc;
            --placeholder: #ebe6e2;
        }

        html {
            font-size: 62.5%;
        }

        body {
            margin: 0;
            font-family: var(--font);
            font-size: 1.6rem;
            color: var(--primary);
        }

        #wrap {
            width: 100%;
            max-width: 1024px;
            min-width: 360px;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: var(--bg);
        }

        header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 48px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .close_btn {
            position: absolute;
            top: 12px;
            right: 20px;
            width: 23px;
            height: 23px;
            padding: 0;
            border: 0;
            background: url(img/Close.svg) no-repeat center / 23px;
        }

        main {
            padding: 58px 20px 36px;
        }

        .result {
            padding-top: 80px;
            text-align: center;
        }

        .result h2 {
            margin: 0 0 16px;
            font-family: var(--font-BKR);
            font-size: 2.4rem;
            line-height: 1.2;
        }

        .result p {
            margin: 0;
            font-family: var(--font-Pre);
            font-size: 1.4rem;
            line-height: 1.5;
            color: var(--text);
        }

        .login_btn {
            display: block;
            width: 100%;
            height: 44px;
            margin-top: 48px;
            border-radius: 9999px;
            background-color: var(--primary);
            color: var(--placeholder);
            font-family: var(--font);
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 44px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .login_btn:focus-visible,
        .close_btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <header>
            <h1>비밀번호 재설정</h1>
            <button type="button" class="close_btn">
                <span class="sr-only">닫기</span>
            </button>
        </header>

        <main>
            <section class="result">
                <h2>비밀번호 재설정 완료</h2>
                <p>
                    새로운 비밀번호가 설정되었습니다.<br>
                    변경한 비밀번호로 로그인해 주세요.
                </p>

                <a class="login_btn" href="login.html">
                    로그인으로 돌아가기
                </a>
            </section>
        </main>
    </div>
</body>
</html>
