  // 메뉴 페이지에 등록된 8개 제품을 기준으로 구성한 상세 콘텐츠입니다.

  const products = {
    "xmas-fraisier": {

      description:"선명한 딸기의 산뜻함과 부드러운 크림이 조화를 이루는 시즌 케이크예요. 촉촉한 케이크 시트와 딸기의 상큼한 맛이 한입마다 균형 있게 이어집니다. 크리스마스 테이블이나 연말 모임에서 함께 나누기 좋아요.",
      recommend:["딸기의 산뜻한 맛을 좋아하시는 분","연말 모임에 계절감 있는 케이크를 준비하고 싶은 분"],
      size:"매장 문의", price:"00,000원", storage:"냉장 보관 후 당일 섭취를 권장합니다.", expiry:"구매 후 가급적 당일 섭취해 주세요.", booking:"시즌 제품으로 예약 가능 여부와 수령 일정은 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/sp_cake02.png"]
    },
    "xmas-ganache": {
      category:"크리스마스 케이크", name:"X-mas 사각가나슈 S", english:"X-mas Square Ganache S",
      description:"사각 형태로 담아낸 진한 초콜릿 풍미가 중심이 되는 시즌 케이크예요. 가나슈 특유의 밀도 있는 맛이 부드러운 케이크 시트와 어우러져 차분한 여운을 남깁니다. 초콜릿 디저트를 좋아하는 분들과 나누는 연말 디저트로 잘 어울려요.",
      recommend:["진하고 깊은 초콜릿 풍미를 선호하시는 분","여럿이 나누기 좋은 시즌 케이크를 찾는 분"],
      size:"S 사이즈", price:"00,000원", storage:"냉장 보관해 주세요.", expiry:"구매 후 가급적 당일 섭취를 권장합니다.", booking:"예약 및 수령 일정은 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/sp_cake03.png"]
    },
    "xmas-strawberry": {
      category:"크리스마스 케이크", name:"X-mas 한스 딸기생크림 S", english:"X-mas HANS Strawberry Cream S",
      description:"부드러운 생크림과 딸기의 산뜻한 조합을 크리스마스 분위기로 완성한 케이크예요. 촉촉한 시트 사이로 크림의 부드러움과 과일의 상큼함이 이어집니다. 가족이나 친구와 함께하는 작은 연말 축하 자리에 곁들이기 좋아요.",
      recommend:["생크림 케이크와 딸기 조합을 좋아하시는 분","크리스마스 분위기의 케이크를 찾는 분"],
      size:"S 사이즈", price:"00,000원", storage:"냉장 보관 후 당일 섭취를 권장합니다.", expiry:"구매 후 가급적 당일 섭취해 주세요.", booking:"시즌 제품의 예약 일정은 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/sp_cake04.png"]
    },
    "xmas-cheese-tart-mini": {
      category:"크리스마스 디저트", name:"X-mas 딸기 치즈 타르트 mini", english:"X-mas Strawberry Cheese Tart Mini",
      description:"바삭한 타르트와 부드러운 치즈 풍미에 딸기의 산뜻함을 더한 크리스마스 시즌 미니 디저트예요. 작은 크기로 연말 티타임이나 가벼운 디저트로 즐기기 좋아요.",
      recommend:["딸기와 치즈의 조합을 좋아하시는 분","작은 크기의 시즌 디저트를 찾는 분"],
      size:"미니", price:"00,000원", storage:"냉장 보관해 주세요.", expiry:"제품 포장에 표시된 소비기한을 확인해 주세요.", booking:"시즌 제품의 판매 및 예약 여부는 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/sp_cake05.png"]
    },
    "almond-delight": {
      category:"쿠키", name:"아몬드 딜라이트", english:"Almond Delight",
      description:"아몬드의 고소한 풍미를 살린 쿠키예요. 한입 베어 물면 바삭한 식감과 견과류의 담백한 맛이 어우러집니다. 커피나 차와 함께 가볍게 즐기는 티타임에 잘 어울려요.",
      recommend:["고소한 견과류 풍미를 좋아하시는 분","커피와 곁들일 바삭한 간식을 찾는 분"],
      size:"개별 제품 구성은 매장 문의", price:"00,000원", storage:"직사광선과 습기를 피해 서늘한 곳에 보관해 주세요.", expiry:"제품 포장에 표시된 소비기한을 확인해 주세요.", booking:"재고 및 구매 가능 여부는 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/img01.png"]
    },
    "almond-chocolate": {
      category:"초콜릿", name:"아몬드 쇼콜라", english:"Almond Chocolat",
      description:"아몬드의 고소함에 초콜릿의 진한 풍미를 더한 디저트예요. 견과류의 담백한 맛과 초콜릿의 부드럽고 깊은 여운이 조화를 이룹니다. 달지 않은 커피나 따뜻한 차와 함께 천천히 즐겨보세요.",
      recommend:["아몬드와 초콜릿 조합을 좋아하시는 분","차와 함께 즐길 디저트를 찾는 분"],
      size:"매장 문의", price:"00,000원", storage:"고온과 직사광선을 피해 서늘한 곳에 보관해 주세요.", expiry:"제품 포장에 표시된 소비기한을 확인해 주세요.", booking:"구매 및 재고는 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/img02.png"]
    },
    "carrot-cake": {
      category:"케이크", name:"당근케이크", english:"Carrot Cake",
      description:"당근의 은은한 풍미와 부드러운 크림이 층을 이루는 케이크예요. 촉촉한 시트의 포근한 식감에 크림의 산뜻하고 부드러운 질감이 더해집니다. 진한 커피와 함께하는 오후의 디저트로 추천해요.",
      recommend:["촉촉한 시트와 크림의 조합을 좋아하시는 분","커피와 잘 어울리는 케이크를 찾는 분"],
      size:"매장 문의", price:"00,000원", storage:"냉장 보관 후 당일 섭취를 권장합니다.", expiry:"구매 후 가급적 당일 섭취해 주세요.", booking:"예약 및 수령 일정은 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/img03.png"]
    },
    "valrhona-mini": {
      category:"케이크", name:"발로나초코 mini", english:"Valrhona Chocolate Mini",
      description:"진한 초콜릿 풍미를 작은 크기에 담은 미니 케이크예요. 초콜릿의 깊고 묵직한 맛이 부드러운 케이크의 식감과 어우러져 한 조각만으로도 만족스러운 디저트 시간을 만들어 줍니다. 혼자 즐기는 디저트나 작은 선물로 곁들이기 좋아요.",
      recommend:["진한 초콜릿 케이크를 좋아하시는 분","부담 없이 즐길 작은 케이크를 찾는 분"],
      size:"미니", price:"00,000원", storage:"냉장 보관 후 당일 섭취를 권장합니다.", expiry:"구매 후 가급적 당일 섭취해 주세요.", booking:"재고 및 예약 가능 여부는 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/img04.png"]
    },
    "strawberry": {
      category:"케이크", name:"딸기 생크림 케이크", english:"Strawberry Fresh Cream Cake",
      description:"부드러운 시트와 산뜻한 딸기, 가벼운 생크림이 조화를 이루는 케이크예요. 촉촉한 시트 사이로 크림의 부드러움과 딸기의 상큼함이 자연스럽게 이어집니다. 생일이나 기념일은 물론 평범한 날의 작은 축하에도 잘 어울려요.",
      recommend:["과일과 생크림의 산뜻한 조합을 좋아하시는 분","생일이나 기념일 케이크를 준비하는 분"],
      size:"매장 문의", price:"00,000원", storage:"냉장 보관 후 당일 섭취를 권장합니다.", expiry:"구매 후 가급적 당일 섭취해 주세요.", booking:"예약 및 수령 일정은 매장에 문의해 주세요.", allergy:"매장에서 확인해 주세요.",
      images:["img/img05.png"]
    }
  };

  const order=Object.keys(products);
  const params=new URLSearchParams(location.search);
  const requested=params.get("item");
  const key=products[requested]?requested:"strawberry";
  const product=products[key];
  const $=id=>document.getElementById(id);
  $("detail-type").textContent=product.category;
  $("detail-title").textContent=product.name;
  $("detail-english").textContent=product.english;
  $("detail-description").textContent=product.description;
  $("detail-recommendations").innerHTML=product.recommend.map(line=>"<li>"+line+"</li>").join("");
  const facts=[["사이즈",product.size],["가격",product.price],["보관 방법",product.storage],["소비 기한",product.expiry],["예약 안내",product.booking],["원재료·알레르기 정보",product.allergy]];
  $("detail-facts").innerHTML=facts.map(([label,value])=>"<div><dt>"+label+"</dt><dd>"+value+"</dd></div>").join("");

  const visual=$("detail-image"), dots=$("detail-dots");
  let imageIndex=0;
  function showImage(index){
    imageIndex=(index+product.images.length)%product.images.length;
    const src=product.images[imageIndex];
    visual.innerHTML='<img src="'+src+'" alt="'+product.name+'">';
    const productImage=visual.querySelector("img");
    productImage.addEventListener("error",()=>{
      visual.textContent="제품 이미지를 준비 중입니다";
      visual.classList.add("menu-detail__visual--empty");
    },{once:true});
    visual.classList.remove("menu-detail__visual--empty");
    visual.setAttribute("aria-label",product.name+" 이미지 "+(imageIndex+1));
    dots.innerHTML=product.images.map((_,i)=>'<button type="button" aria-label="이미지 '+(i+1)+' 보기" aria-current="'+(i===imageIndex?'true':'false')+'" data-index="'+i+'"></button>').join("");
    // 점 표시는 한 제품에 이미지가 여러 장일 때만 사용합니다.
    dots.hidden=product.images.length<=1;
  }
  showImage(0);

  // 좌우 화살표는 이미지가 아니라 menu.html 카드 순서대로 제품 상세 페이지를 이동합니다.
  const previousId=order[(order.indexOf(key)-1+order.length)%order.length];
  const nextId=order[(order.indexOf(key)+1)%order.length];
  const previousButton=document.querySelector(".menu-detail__arrow--prev");
  const nextButton=document.querySelector(".menu-detail__arrow--next");
  previousButton.title=products[previousId].name;
  nextButton.title=products[nextId].name;
  previousButton.addEventListener("click",()=>{ location.href="menu-detail.html?item="+previousId; });
  nextButton.addEventListener("click",()=>{ location.href="menu-detail.html?item="+nextId; });
  dots.addEventListener("click",event=>{
    const button=event.target.closest("button[data-index]");
    if(button)showImage(Number(button.dataset.index));
  });

  const related=order.filter(id=>id!==key).slice(0,3);
  $("related-products").innerHTML=related.map(id=>{
    const item=products[id];
    return '<article class="menu-detail__related-card"><a href="menu-detail.html?item='+id+'"><div class="menu-detail__related-image"><img src="'+item.images[0]+'" alt="'+item.name+'" onerror="this.style.display=\'none\';this.parentElement.textContent=\'이미지 준비 중\'"></div><div class="menu-detail__related-copy"><p>'+item.category+'</p><h3>'+item.name+'</h3><span>'+item.description.split(".")[0]+'</span></div></a></article>';
  }).join("");
  document.title=product.name+" | HANS CAKE";
})();
</script>
</body></html>
