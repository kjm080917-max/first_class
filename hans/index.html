<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한스리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
    <style>
        #wrap {background-color: yellow;}
    </style>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="visual hero-sec">
                <div class="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/cake.png" alt="Slide 1" class="pc">
                            <img src="img/cake_m.jpg" alt="Slide 1_m" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/hero.png" alt="Slide 2" class="pc">
                            <img src="img/hero_m.jpg" alt="Slide 2_m" class="mo">
                        </div>
                    </div>

                    <div class="hero-controls">
                        <div class="swiper-scrollbar" aria-label="슬라이드 진행 상태"></div>
                        <div class="swiper-pagination" aria-label="현재 슬라이드"></div>
                        <div class="hero-arrows">
                            <button type="button" class="hero-prev" aria-label="이전 슬라이드">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18 9 12l6-6"/></svg>
                            </button>
                            <button type="button" class="hero-next" aria-label="다음 슬라이드">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>&copy; </footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,

            navigation: {
                nextEl: '.hero-next',
                prevEl: '.hero-prev',
            },

            pagination: {
                el: '.swiper-pagination',
                type: 'fraction',
                formatFractionCurrent: (number) => number,
                formatFractionTotal: (number) => number,
                renderFraction: (currentClass, totalClass) =>
                    '<span class="' + currentClass + '"></span>' +
                    '<span class="fraction-divider"> | </span>' +
                    '<span class="' + totalClass + '"></span>',
            },

            scrollbar: {
                el: '.visual .swiper-scrollbar',
                draggable: true,
                hide: false,
            },
        });
    </script>
</body>
</html>
