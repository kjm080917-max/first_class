<main class="event-page">
<section class="event-page__intro" aria-labelledby="event-page-title">
  <h1 id="event-page-title">이벤트</h1>
  <p>한스의 다양한 이벤트를 만나보세요.</p>
</section>
<section class="event-list section-shell" id="event-list" aria-label="이벤트 목록">
  <div class="event-filter" role="group" aria-label="이벤트 상태 필터">
    <button type="button" class="is-active" data-filter="all" aria-pressed="true">모든 이벤트</button>
    <button type="button" data-filter="ongoing" aria-pressed="false">진행중인 이벤트</button>
    <button type="button" data-filter="ended" aria-pressed="false">종료된 이벤트</button>
  </div>
  <div class="event-card-grid" id="event-card-grid" aria-live="polite"></div>
  <nav class="event-pagination" id="event-pagination" aria-label="이벤트 페이지 이동"></nav>

<button class="to-top" type="button" aria-label="맨 위로 이동"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><script>
(() => {
  // 이미지 파일이 준비된 e01.png~e07.png 이벤트만 표시합니다.
  const events = [];

  const pageSize = 6;
  const grid = document.getElementById("event-card-grid");
  const pagination = document.getElementById("event-pagination");
  const filterButtons = document.querySelectorAll(".event-filter button");
  let currentFilter = "all";
  let currentPage = 1;

  const getFilteredEvents = () => events.filter(event =>
    currentFilter === "all" || event.status === currentFilter
  );

  function renderCards() {
    const filteredEvents = getFilteredEvents();
    if (!filteredEvents.length) {
      grid.innerHTML = '<p class="event-empty">등록된 이벤트가 없습니다.</p>';
      pagination.replaceChildren();
      return;
    }
    const pageCount = Math.max(1, Math.ceil(filteredEvents.length / pageSize));
    currentPage = Math.min(currentPage, pageCount);
    const visibleEvents = filteredEvents.slice((currentPage - 1) * pageSize, currentPage * pageSize);

    grid.innerHTML = visibleEvents.map(event => {
      const statusText = event.status === "ongoing" ? "진행중인 이벤트" : "종료된 이벤트";
      const statusClass = event.status === "ongoing" ? "is-ongoing" : "is-ended";
      return `
        <a class="event-card" href="event-detail.html?id=${encodeURIComponent(event.id)}">
          <div class="event-card__image">
            <img src="${event.image}" alt="${event.title}" loading="lazy">
          </div>
          <div class="event-card__content">
            <p class="event-card__status ${statusClass}">${statusText}</p>
            <h2 class="event-card__title">${event.title} (${event.period})</h2>
          </div>
        </a>`;
    }).join("");

    grid.querySelectorAll(".event-card__image img").forEach(img => {
      img.addEventListener("load", () => img.parentElement.classList.add("is-loaded"));
      img.addEventListener("error", () => img.remove());
      if (img.complete && img.naturalWidth > 0) img.parentElement.classList.add("is-loaded");
    });

    renderPagination(pageCount);
  }

  function renderPagination(pageCount) {
    const pageButtons = Array.from({ length: pageCount }, (_, index) => {
      const page = index + 1;
      return `<button type="button" class="event-pagination__number ${page === currentPage ? "is-current" : ""}" data-page="${page}" aria-label="${page}페이지" aria-current="${page === currentPage ? "page" : "false"}">${page}</button>`;
    }).join("");

    pagination.innerHTML = `
      <button type="button" class="event-pagination__arrow" data-page="${Math.max(1, currentPage - 1)}" aria-label="이전 페이지" ${currentPage === 1 ? "disabled" : ""}>‹</button>
      ${pageButtons}
      <button type="button" class="event-pagination__arrow" data-page="${Math.min(pageCount, currentPage + 1)}" aria-label="다음 페이지" ${currentPage === pageCount ? "disabled" : ""}>›</button>`;
  }

  filterButtons.forEach(button => {
    button.addEventListener("click", () => {
      currentFilter = button.dataset.filter;
      currentPage = 1;
      filterButtons.forEach(item => {
        const active = item === button;
        item.classList.toggle("is-active", active);
        item.setAttribute("aria-pressed", String(active));
      });
      renderCards();
    });
  });

  pagination.addEventListener("click", event => {
    const button = event.target.closest("button[data-page]");
    if (!button || button.disabled) return;
    currentPage = Number(button.dataset.page);
    renderCards();
  });

  renderCards();
})();
</script><script src="js/event.js"></script></body></html>
