<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- 폰트 및 기본 CSS 경로 (필요 시 파일 위치에 맞게 수정) -->
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        
        <!-- 방금 만든 외부 CSS 연결 -->
        <link rel="stylesheet" href="style.css">
        
        <title>페이스북 로그인 화면</title>
    </head>
    <body>
        <div id="wrap">
            <!-- 헤더 -->
            <header> 
                <h1>로그인</h1>
                <button type="button" class="prev_btn"><span class="sr-only">이전버튼</span></button> 
            </header>

            <!-- 메인 콘텐츠 -->
            <main>
                <h2 class="title">
                    <span>안녕하세요:)</span>
                    <span>페이스북입니다</span>
                </h2>
                
                <form action="">
                    <fieldset>
                        <legend class="sr-only">로그인화면</legend>
                        
                        <!-- 아이디 입력 -->
                        <label for="email" class="email">이메일 로그인</label>
                        <div class="input_box">
                            <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요.">
                        </div>
                        
                        <!-- 비밀번호 입력 -->
                        <div class="input_box password_box">
                            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해 주세요">
                            <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span>
                            </button>
                        </div>
                        
                        <!-- 로그인 옵션 -->
                        <div class="login_option">
                            <label>
                                <input type="checkbox" class="check sr-only" checked>
                                <span>자동로그인</span>
                            </label>
                            <label>
                                <input type="checkbox" class="check sr-only">
                                <span>아이디 저장</span>
                            </label>
                        </div>
                        
                        <button type="submit" class="login_btn">로그인</button>
                    </fieldset>
                </form>

                <!-- 하단 링크 -->
                <div class="login_link">
                    <a href="#">아이디 찾기</a>
                    <a href="#">비밀번호 재설정</a>
                    <a href="#">회원가입</a>
                </div>

                <!-- SNS 로그인 -->
                <div class="sns_login">
                    <p>SNS으로 간편하게 로그인</p>
                    <div class="sns_list">
                        <a href="#"><span class="sr-only">카카오로그인</span></a>
                        <a href="#"><span class="sr-only">네이버로그인</span></a>
                        <a href="#"><span class="sr-only">애플로그인</span></a>
                        <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
