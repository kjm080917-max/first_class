<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        <title>페이스북 로그인 화면</title>
        <style>
            :root {
                --font: "Pretendard Variable", sans-serif;
                --font-Pre: "Pretendard Variable", sans-serif;
                --primary: #003CDA;
                --active: #343B46;
                --disabledBg: #D6D8DA;
                --focus: #343B46;
                --baseBorder: #E9E9F0;
                --errorColor: #C54734;
                --placeholder: #E0E1E8;
                --text: #343B46;
                --subText: #8B93A1;
                --divider: #F5F5F5;
                --bg: #FFFFFF;
            }

            html {
                font-size: 62.5%;
            }

            /* 전체 텍스트 속성 */
            body {
                font-family: var(--font);
                font-size: 1.6rem;
                color: var(--text);
                background-color: var(--bg);
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            button {
                border: none;
                background: none;
                font: inherit;
                color: inherit;
                cursor: pointer;
            }

            input {
                font: inherit;
            }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            #wrap {
                width: 100%;
                max-width: 1024px;
                min-width: 360px;
                margin: 0 auto;
                background-color: var(--bg);
                min-height: 100dvh;
            }

            header {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: flex-end;
                height: 73px;
            }

            header h1 img {
                display: block;
                width: 50px;
                height: 50px;
            }

            .prev_btn {
                position: absolute;
                left: 0;
                top: 8px;
                width: 48px;
                height: 48px;
                background: url(img/back_icon.svg) no-repeat center / auto;
            }

            main {
                padding: 20px 20px 40px;
            }

            .title {
                display: flex;
                flex-direction: column;
                padding: 0 5px;
            }

            .title span:first-child {
                font-size: 2.0rem;
                font-weight: 700;
                line-height: 26px;
            }

            .title span:last-child {
                font-size: 1.3rem;
                line-height: 18px;
                color: var(--subText);
            }

            form {
                margin-top: 87px;
            }

            fieldset {
                border: none;
            }

            .email {
                display: block;
                margin-bottom: 8px;
                font-size: 1.5rem;
                font-weight: 700;
                line-height: 22px;
            }

            .input_box {
                position: relative;
                margin-bottom: 10px;
            }

            input[type="email"],
            input[type="password"] {
                width: 100%;
                height: 50px;
                padding: 0 20px;
                border: 1px solid var(--baseBorder);
                border-radius: 12px;
                background-color: var(--bg);
                font-family: inherit;
                font-size: 1.5rem;
                font-weight: 600;
                color: var(--text);
                outline: none;
            }

            input::placeholder {
                font-weight: 400;
                color: var(--placeholder);
            }

            /* 비밀번호 점 간격 */
            input[type="password"]:not(:placeholder-shown) {
                letter-spacing: 4px;
            }

            /* 입력 중 */
            input[type="email"]:focus,
            input[type="password"]:focus {
                border-color: var(--focus);
            }

            /* 지우기 버튼 (입력 중일 때만 보임) */
            .clear_btn {
                display: none;
                position: absolute;
                top: 16px;
                right: 16px;
                width: 18px;
                height: 18px;
                background: url(img/clear_icon.svg) no-repeat center / contain;
            }

            .input_box.has_value:focus-within .clear_btn {
                display: block;
            }

            /* 에러 상태 */
            .input_box.error {
                margin-bottom: 4px;
            }

            .input_box.error input[type="email"] {
                height: 44px;
            }

            .error_txt {
                margin-top: 6px;
                padding-left: 11px;
                font-size: 1.2rem;
                line-height: 16px;
                color: var(--errorColor);
            }

            .error_txt[hidden] {
                display: none;
            }

            .login_option {
                display: flex;
                align-items: center;
                column-gap: 26px;
                margin-top: 14px;
            }

            .login_option label {
                display: inline-flex;
                font-size: 1.5rem;
                font-weight: 600;
                cursor: pointer;
            }

            .login_option span {
                display: inline-flex;
                align-items: center;
                column-gap: 8px;
            }

            .login_option .check + span::before {
                content: "";
                display: inline-block;
                width: 26px;
                height: 26px;
                background: url(img/checkbox_disabled.svg) no-repeat center / contain;
            }

            .login_option .check:checked + span::before {
                background: url(img/checkbox_active.svg) no-repeat center / contain;
            }

            .login_btn {
                display: block;
                width: 100%;
                height: 50px;
                margin-top: 22px;
                border: none;
                border-radius: 25px;
                font-family: inherit;
                font-size: 1.5rem;
                font-weight: 700;
                color: #fff;
                background-color: var(--active);
            }

            .login_btn:disabled {
                background-color: var(--disabledBg);
                cursor: default;
            }

            .login_link {
                display: flex;
                justify-content: center;
                margin-top: 20px;
                font-family: var(--font-Pre);
                font-weight: 500;
                font-size: 1.3rem;
                line-height: 14px;
            }

            .login_link a {
                display: inline-flex;
                align-items: center;
                column-gap: 12px;
            }

            .login_link a + a {
                margin-left: 12px;
            }

            .login_link a::after {
                content: "";
                display: inline-block;
                width: 1px;
                height: 12px;
                background-color: var(--baseBorder);
            }

            .login_link a:last-child::after {
                display: none;
            }

            .sns_login {
                margin-top: 88px;
            }

            /* 에러 문구가 생겨도 SNS 영역 위치는 그대로 */
            form.error + .login_link + .sns_login {
                margin-top: 78px;
            }

            .sns_login > p {
                display: flex;
                align-items: center;
                column-gap: 11px;
                margin-bottom: 33px;
                font-size: 1.3rem;
                font-weight: 700;
                line-height: 18px;
                white-space: nowrap;
            }

            .sns_login > p::before,
            .sns_login > p::after {
                content: "";
                flex: 1;
                height: 1px;
                background-color: var(--divider);
            }

            .sns_list {
                display: flex;
                align-items: center;
                justify-content: center;
                column-gap: 20px;
            }

            .sns_list > a {
                display: inline-block;
                width: 48px;
                height: 48px;
                background-repeat: no-repeat;
                background-position: center;
                background-size: 48px;
            }

            .sns_list > a:nth-child(1) {
                background-image: url(img/kakao_logo_icon.png);
            }

            .sns_list > a:nth-child(2) {
                background-image: url(img/naver_logo_icon.png);
            }

            .sns_list > a:nth-child(3) {
                background-image: url(img/apple_logo_icon.png);
            }

            .sns_list > a:nth-child(4) {
                background-image: url(img/samsung_logo_icon.png);
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <!-- 로그인 폼 내용 -->
            <header>
                <h1>
                    <img src="img/facebook_logo.png" alt="페이스북">
                    <span class="sr-only">로그인</span>
                </h1>
                <button type="button" class="prev_btn"><span class="sr-only">이전버튼</span></button>
            </header>
            <main>
                <h2 class="title">
                    <span>로그인</span>
                    <span>이메일 주소와 비밀번호를 입력해 주세요</span>
                </h2>
                <form action="" novalidate>
                    <!--이메일 로그인-->
                    <fieldset>
                        <legend class="sr-only">로그인화면</legend>
                        <!--아이디-->
                        <label for="email" class="email">이메일 로그인</label>
                        <div class="input_box" id="email_box">
                            <input type="email" id="email" name="email"
                            placeholder="값을 입력해 주세요." aria-describedby="email_error">
                            <button type="button" class="clear_btn">
                            <span class="sr-only">입력 내용 지우기</span></button>
                            <p class="error_txt" id="email_error" role="alert" hidden>에러메시지입니다. 다시 입력해 주세요</p>
                        </div>
                        <!--비밀번호-->
                        <div class="input_box">
                            <label for="password" class="sr-only">비밀번호</label>
                            <input type="password" id="password" name="password"
                            placeholder="비밀번호를 입력해 주세요.">
                        </div>
                        <div class="login_option">
                            <label>
                                <input type="checkbox" class="check sr-only" checked>
                                <span>자동 로그인</span>
                            </label>
                            <label>
                                <input type="checkbox" class="check sr-only">
                                <span>아이디 저장</span>
                            </label>
                        </div>
                        <button type="submit" class="login_btn" disabled>로그인</button>
                    </fieldset>
                </form>
                <div class="login_link">
                    <a href="#">아이디 찾기</a>
                    <a href="#">비밀번호 재설정</a>
                    <a href="#">회원가입</a>
                </div>
                <div class="sns_login">
                    <p>SNS으로 간편하게 로그인</p>
                    <div class="sns_list">
                        <a href="#"><span class="sr-only">카카오로그인</span></a>
                        <a href="#"><span class="sr-only">네이버로그인</span></a>
                        <a href="#"><span class="sr-only">애플로그인</span></a>
                        <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                    </div>
                </div>
            </main>
        </div>

        <script>
            var form = document.querySelector("form");
            var emailBox = document.getElementById("email_box");
            var email = document.getElementById("email");
            var clearBtn = document.querySelector(".clear_btn");
            var errorTxt = document.getElementById("email_error");
            var loginBtn = document.querySelector(".login_btn");

            // 이메일 입력 여부에 따라 로그인 버튼 / 지우기 버튼 상태 변경
            function checkInput() {
                loginBtn.disabled = (email.value === "");
                emailBox.classList.toggle("has_value", email.value !== "");
            }

            // 에러 상태 해제
            function clearError() {
                emailBox.classList.remove("error");
                form.classList.remove("error");
                errorTxt.hidden = true;
            }

            email.addEventListener("input", function () {
                checkInput();
                clearError();
            });

            clearBtn.addEventListener("click", function () {
                email.value = "";
                checkInput();
                clearError();
                email.focus();
            });

            // 이메일 형식이 아니면 에러 메시지 표시
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                var isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);

                if (!isEmail) {
                    emailBox.classList.add("error");
                    form.classList.add("error");
                    errorTxt.hidden = false;
                }
            });
        </script>
    </body>
</html>
