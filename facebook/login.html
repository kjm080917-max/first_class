<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        <title>페이스북 로그인 화면</title>
        <style>
            :root {
                --font: "Pretendard Variable", sans-serif;
                --font-Pre: "Pretendard Variable", sans-serif;
                --primary: #003CDA;
                --active: #343B46;
                --disabledBg: #D6D8DA;
                --focus: #343B46;
                --baseBorder: #E9E9F0;
                --errorColor: #C54734;
                --placeholder: #E0E1E8;
                --text: #343B46;
                --subText: #8B93A1;
                --divider: #F5F5F5;
                --bg: #FFFFFF;
            }
            html {
                font-size: 62.5%;
            }
            /* 전체 텍스트 속성 */
            body {
                font-family: var(--font);
                font-size: 1.6rem;
                color: var(--text);
            }
            a {
                color: inherit;
                text-decoration: none;
            }
            #wrap {
                width: 100%;
                background-color: var(--bg);
                max-width: 1024px;
                min-width: 360px;
                margin: 0 auto;
                min-height: 100dvh;
            }
            header {
                position: relative;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 48px;
            }
            .prev_btn {
                position: absolute;
                left: 0;
                width: 48px;
                height: 48px;
                border: none;
                background: url(img/back_icon.svg) no-repeat center / auto;
                cursor: pointer;
            }
            h1 {
                font-size: 2.0rem;
                order: 2;
            }
            main {
                padding: 48px 20px 90px;
            }
            .title {
                display: flex;
                flex-direction: column;
                gap: 16px;
                margin-bottom: 50px;
            }
            .title span:first-child {
                font-size: 2.5rem;
                font-weight: 700;
            }
            .title > span:last-child {
                font-size: 3.5rem;
                font-weight: 700;
                color: var(--primary);
            }
            input {
                font-family: inherit;
                font-size: inherit;
                color: inherit;
                border: 1px solid var(--baseBorder);
                background-color: var(--bg);
            }
            input::placeholder {
                color: var(--placeholder);
            }
            .email {
                font-size: 1.5rem;
                line-height: 1;
                font-weight: 700;
            }
            input[type="email"] {
                margin-top: 8px;
            }
            input[type="password"] {
                margin-top: 0;
            }
            input[type="email"], 
            input[type="password"] {
                width: 100%;
                height: 50px;
                padding-left: 20px;
                padding-right: 20px;
                border-radius: 10px;
            }
            .input_box {
                margin-top: 8px;
            }
            .password_box {
                position: relative;
                margin-top: 10px;
            }
            .password_box input {
                display: block;
                padding-right: 56px;
            }
            .pw_btn {
                position: absolute;
                top: 50%;
                right: 16px;
                transform: translateY(-50%);
                width: 26px;
                height: 26px;
                border: none;
                background: url(img/eye_icon.svg) no-repeat center / auto; 
                cursor: pointer;
            }
            .login_option {
                margin-top: 12px;
            }
            .login_option label {
                display: inline-flex;
                cursor: pointer;
            }
            .login_option label:first-child {
                margin-right: 30px;
            }
            .login_option span {
                display: inline-flex;
                align-items: center;
                column-gap: 6px;
            }
            .login_option .check + span::before {
                content: "";
                display: inline-block;
                width: 30px;
                height: 30px;
                background: url(img/checkbox_disabled.svg) no-repeat center / contain;
            }
            .login_option .check:checked + span::before {
                content: "";
                display: inline-block;
                width: 30px;
                height: 30px;
                background: url(img/checkbox_active.svg) no-repeat center / contain;
            }
            .login_btn {
                width: 100%;
                height: 50px;
                margin-top: 22px;
                border-radius: 22px;
                font-family: inherit;
                font-size: 1.5rem;
                font-weight: 700;
                color: #FFFFFF;
                background-color: var(--active);
                border: none;
                cursor: pointer;
            }
            .login_btn:disabled {
                background-color: var(--disabledBg);
                cursor: default;
            }
            .login_link {
                margin-top: 20px;
                font-family: var(--font-Pre);
                font-weight: 500;
                font-size: 1.4rem;
                text-align: center;
            }
            .login_link a {
                display: inline-flex;
                align-items: center;
                column-gap: 4px;
            }
            .login_link a::after {
                content: "";
                display: inline-block;
                width: 1px;
                height: 12px;
                background-color: var(--text);
                opacity: 0.3;
                margin-left: 8px;
                margin-right: 8px;
            }
            .login_link a:last-child::after {
                display: none;
            }
            .sns_login {
                margin-top: 96px;
            }
            .sns_login > p {
                display: flex;
                align-items: center;
                column-gap: 12px;
                font-size: 1.3rem;
                margin-bottom: 35px;
                color: var(--subText);
                white-space: nowrap;
            }
            .sns_login > p::before,
            .sns_login > p::after {
                content: "";
                display: inline-block;
                width: 100%;
                height: 1px;
                background-color: var(--divider);
            }
            .sns_list {
                display: flex;
                align-items: center;
                justify-content: center;
                column-gap: 20px;
            }
            .sns_list > a {
                display: inline-block
