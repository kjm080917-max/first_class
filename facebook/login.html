<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../css/default.css">
        <link rel="stylesheet" href="./login.css">

        <title>페이스북 로그인 화면</title>
    </head>
    <body>
        <div id="wrap">
            <header>
                <h1>로그인</h1>
                <button type="button" class="prev_btn">
                    <span class="sr-only">이전 버튼</span>
                </button>
            </header>

            <main>
                <section class="login_content">
                    <h2 class="title">
                        <span>안녕하세요:)</span>
                        <span>페이스북입니다</span>
                    </h2>

                    <form action="" class="login_form">
                        <fieldset>
                            <legend class="sr-only">이메일 로그인</legend>

                            <label for="email" class="email_label">이메일 로그인</label>
                            <div class="input_box">
                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="아이디(이메일)을 입력해 주세요."
                                >
                            </div>

                            <div class="input_box password_box">
                                <label for="password" class="sr-only">비밀번호</label>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="비밀번호를 입력해 주세요"
                                >
                                <button type="button" class="pw_btn">
                                    <span class="sr-only">비밀번호 보기</span>
                                </button>
                            </div>

                            <div class="login_option">
                                <label>
                                    <input type="checkbox" class="check sr-only" checked>
                                    <span>자동로그인</span>
                                </label>
                                <label>
                                    <input type="checkbox" class="check sr-only">
                                    <span>아이디 저장</span>
                                </label>
                            </div>

                            <button type="submit" class="login_btn">로그인</button>
                        </fieldset>
                    </form>

                    <nav class="login_link" aria-label="계정 관련 메뉴">
                        <a href="#">아이디 찾기</a>
                        <a href="#">비밀번호 재설정</a>
                        <a href="#">회원가입</a>
                    </nav>

                    <section class="sns_login">
                        <h2>SNS으로 간편하게 로그인</h2>
                        <div class="sns_list">
                            <a href="#" class="kakao_login">
                                <span class="sr-only">카카오 로그인</span>
                            </a>
                            <a href="#" class="naver_login">
                                <span class="sr-only">네이버 로그인</span>
                            </a>
                            <a href="#" class="apple_login">
                                <span class="sr-only">애플 로그인</span>
                            </a>
                            <a href="#" class="samsung_login">
                                <span class="sr-only">삼성카드 로그인</span>
                            </a>
                        </div>
                    </section>
                </section>
            </main>
        </div>
    </body>
</html>
